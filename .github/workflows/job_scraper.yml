name: Germany Job Scraper

on:
  # Automatic schedule is disabled -- this now only runs when you trigger it
  # yourself from the Actions tab (Actions -> "Germany Job Scraper" -> Run
  # workflow). Re-add a `schedule:` block with a cron line here if you ever
  # want automatic runs back.
  workflow_dispatch: {}

permissions:
  contents: write  # needed to commit the updated seen_jobs.json back to the repo

# Never run two copies at once -- overlapping runs could both try to push the
# dedup state and clobber each other, causing duplicate Telegram posts.
concurrency:
  group: job-scraper
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated dedup state
        # Runs even if the scraper step failed, so jobs we already sent to
        # Telegram are still recorded and never re-sent. Rebase-and-retry so a
        # push can't be lost if main moved while the run was in progress
        # (another cause of duplicate posts).
        if: always()
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@github.com"
          git add state/seen_jobs.json
          if git diff --cached --quiet; then
            echo "No dedup-state changes to commit."
            exit 0
          fi
          git commit -m "Update seen jobs state [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed dedup state on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt) -- rebasing on latest main and retrying."
            git pull --rebase origin main || true
          done
          echo "Could not push dedup state after 5 attempts." >&2
          exit 1
