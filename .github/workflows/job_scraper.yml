name: Germany Job Scraper

on:
  # Automatic schedule is disabled -- this now only runs when you trigger it
  # yourself from the Actions tab (Actions -> "Germany Job Scraper" -> Run
  # workflow). Re-add a `schedule:` block with a cron line here if you ever
  # want automatic runs back.
  workflow_dispatch: {}

permissions:
  contents: write  # needed to commit the updated seen_jobs.json back to the repo

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated dedup state
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@github.com"
          git add state/seen_jobs.json
          git diff --cached --quiet || git commit -m "Update seen jobs state [skip ci]"
          git push
